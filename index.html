<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PUCImprest</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Oswald:wght@300;400;500&display=swap');

        body {
            background-color: #EFEFEF;
            color: #2B2B2B;
            font-family: 'Lato', system-ui, sans-serif;
        }

        .navbar {
            background-color: #A52D31 !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
        }

        .navbar-brand {
            font-family: 'Oswald', 'Arial Narrow', sans-serif;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        h1,
        h4 {
            font-family: 'Oswald', 'Arial Narrow', sans-serif;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #8A2427;
        }

        .text-muted {
            color: rgba(43, 43, 43, 0.7) !important;
        }

        .menu-card {
            text-decoration: none;
            color: inherit;
            transition: 0.25s;
        }

        .menu-card:hover {
            transform: translateY(-6px);
        }

        .menu-icon {
            font-size: 55px;
            margin-bottom: 15px;
            color: #8A2427 !important;
        }

        .card {
            border: 1px solid #d4d4d4;
            border-top: 4px solid #8A2427;
            border-radius: 0;
            background-color: #fff;
            transition: 0.25s;
        }

        .card:hover {
            background-color: #EDE0E0;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                <img src="img/logo-pucpr.png" alt="PUCPR" style="height: 40px; width: auto;" class="me-2 align-middle">
                PUCImprest
            </span>
        </div>
    </nav>

    <main class="container py-5">

        <div class="text-center mb-5">
            <h1 class="fw-bold">Menu Principal</h1>
            <p class="text-muted">
                Selecione o cadastro que deseja acessar
            </p>
        </div>

        <div class="row g-4 justify-content-center">

            <div class="col-12 col-sm-6 col-lg-4">
                <a href="usuario.html" class="menu-card">
                    <div class="card text-center p-4 h-100">
                        <div class="menu-icon text-primary">
                            <i class="bi bi-person-badge"></i>
                        </div>

                        <h4 class="fw-bold">Usuário</h4>

                        <p class="text-muted mb-0">
                            Cadastro de usuários
                        </p>
                    </div>
                </a>
            </div>



            <div class="col-12 col-sm-6 col-lg-4">
                <a href="sala.html" class="menu-card">
                    <div class="card text-center p-4 h-100">
                        <div class="menu-icon text-warning">
                            <i class="bi bi-door-open"></i>
                        </div>

                        <h4 class="fw-bold">Sala</h4>

                        <p class="text-muted mb-0">
                            Cadastro de salas
                        </p>
                    </div>
                </a>
            </div>

            <div class="col-12 col-sm-6 col-lg-4">
                <a href="equipamento.html" class="menu-card">
                    <div class="card text-center p-4 h-100">
                        <div class="menu-icon text-danger">
                            <i class="bi bi-pc-display"></i>
                        </div>

                        <h4 class="fw-bold">Equipamento</h4>

                        <p class="text-muted mb-0">
                            Cadastro de equipamentos
                        </p>
                    </div>
                </a>
            </div>

            <div class="col-12 col-sm-6 col-lg-4">
                <a href="ocorrencia.html" class="menu-card">
                    <div class="card text-center p-4 h-100">
                        <div class="menu-icon text-success">
                            <i class="bi bi-exclamation-triangle"></i>
                        </div>

                        <h4 class="fw-bold">Ocorrência</h4>

                        <p class="text-muted mb-0">
                            Cadastro de ocorrências
                        </p>
                    </div>
                </a>
            </div>

            <div class="col-12 col-sm-6 col-lg-4">
                <a href="permissao.html" class="menu-card">
                    <div class="card text-center p-4 h-100">
                        <div class="menu-icon text-info">
                            <i class="bi bi-shield-lock"></i>
                        </div>

                        <h4 class="fw-bold">Permissão</h4>

                        <p class="text-muted mb-0">
                            Cadastro de permissões
                        </p>
                    </div>
                </a>
            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
